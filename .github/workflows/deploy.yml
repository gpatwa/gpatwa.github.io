name: Check and deploy

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate HTML
        run: npx --yes html-validate@9 --config .htmlvalidate.json index.html
      - name: Check internal links and assets
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir "$GITHUB_WORKSPACE" index.html
          fail: true

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html styles.css favicon.svg og.png robots.txt sitemap.xml 404.html _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
